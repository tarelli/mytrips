const map=L.map('map',{worldCopyJump:false,attributionControl:false}).setView([38,-8],3);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{maxZoom:12,subdomains:'abcd'}).addTo(map);
const done=L.layerGroup().addTo(map), live=L.layerGroup().addTo(map),
      pins=L.layerGroup().addTo(map), homeL=L.layerGroup().addTo(map);
const PT={}; DATA.pts.forEach(p=>{PT[p.n]=p;});
let vc={}, vm={};
function visit(n){ const p=PT[n]; if(!p) return;
  vc[n]=(vc[n]||0)+1;
  const r=Math.min(3+Math.sqrt(vc[n])*1.1,11);
  if(!vm[n]){ vm[n]=L.circleMarker([p.lat,p.lon],{radius:1,color:'#7a2018',weight:1.2,
    fillColor:'#c4463a',fillOpacity:.5}).addTo(pins); }
  vm[n].setRadius(r);
  vm[n].bindPopup('<b>'+n+'</b><br>'+vc[n]+(vc[n]===1?' leg':' legs'));
}
const HOUSE='<div class="home-ico"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fdfaf0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5" fill="#0f5b52" stroke="#0f5b52"/><path d="M5 10v10h14V10" fill="#0f5b52" stroke="#0f5b52"/><path d="M3 10.5 12 3l9 7.5M5 10v10h14V10M10 20v-6h4v6"/></svg></div>';
const hIcon=L.divIcon({html:HOUSE,className:'',iconSize:[34,34],iconAnchor:[17,30]});
const ghost=[];
function setHome(e,animate){
  if(window._hm){ const ll=window._hm.getLatLng();
    ghost.push(L.circleMarker(ll,{radius:5,color:'#0f5b52',weight:1.5,fillColor:'#7fb8ae',fillOpacity:.55}).addTo(homeL));
    homeL.removeLayer(window._hm); }
  window._hm=L.marker([e.la,e.lo],{icon:animate?hIcon:L.divIcon({html:HOUSE.replace(' class="home-ico"',''),className:'',iconSize:[34,34],iconAnchor:[17,30]}),zIndexOffset:1000})
    .addTo(homeL).bindPopup('<b>Home: '+e.city+'</b><br>'+e.ctry+'<br>from '+e.d);
}
const EV=DATA.ev, N=EV.length, NF=EV.filter(x=>x.t==='fly').length;
let i=0,seg=0,hold=0,flown=0,playing=true,cur=null,head=null;
const yr=document.getElementById('yr'),rt=document.getElementById('rt'),fill=document.getElementById('fill'),

cnt.textContent='0 / '+NF;
const HOT={color:'#f2600c',weight:3.6,opacity:1,dashArray:null}, OLD={color:'#9c4034',weight:1.1,opacity:.6,dashArray:'5,4'};
function settle(){ if(cur){cur.setStyle(OLD);cur.bringToBack();cur=null;}
                   if(head){live.removeLayer(head);head=null;} }
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function stamp(ds){ return '<span class="mo">'+MON[+ds.slice(5,7)-1]+'</span>'+ds.slice(0,4); }
function hud(e){ yr.innerHTML=stamp(e.d); s1.textContent=e.yr.toFixed(1); s2.textContent=e.cd; }
function step(){
  if(i>=N){playing=false;settle();document.getElementById('play').textContent='Done';
    rt.className='';rt.textContent=NF+' flights \u00b7 20 countries \u00b7 5 continents';return;}
  const e=EV[i];
  if(e.t==='move'){
    if(hold===0){ settle(); setHome(e,true); hud(e); s3.textContent=e.city;
      rt.className='move'; rt.textContent='moved to '+e.city+', '+e.ctry; }
    hold++; if(hold>52){hold=0;i++;} return;
  }
  if(seg===0){ settle(); visit(e.a); visit(e.b); cur=L.polyline([e.p[0]],HOT).addTo(done);
    head=L.circleMarker(e.p[0],{radius:4.5,color:'#fff',weight:1.5,fillColor:'#f2600c',fillOpacity:1}).addTo(live);
    hud(e); rt.className=''; rt.textContent=e.a+'  \u2192  '+e.b; }
  seg+=6; const k=Math.min(seg,e.p.length);
  cur.setLatLngs(e.p.slice(0,k)); head.setLatLng(e.p[k-1]);
  if(seg>=e.p.length){ i++;seg=0;flown++;fill.style.width=(100*flown/NF)+'%';cnt.textContent=flown+' / '+NF; }
}
(function loop(){ if(playing) step(); setTimeout(loop, i<N?14:400); })();
document.getElementById('play').onclick=v=>{if(i>=N)return;playing=!playing;v.target.textContent=playing?'Pause':'Resume';};
function reset(){ done.clearLayers();live.clearLayers();homeL.clearLayers();pins.clearLayers();vc={};vm={};
  window._hm=null;ghost.length=0;
  cur=null;head=null;i=0;seg=0;hold=0;flown=0;fill.style.width='0';cnt.textContent='0 / '+NF;
  s1.textContent='0.0';s2.textContent='0';s3.textContent='Paris';yr.innerHTML=stamp('2005-08-01');rt.textContent='';rt.className=''; }
document.getElementById('rst').onclick=()=>{reset();playing=true;document.getElementById('play').textContent='Pause';};
document.getElementById('track').onclick=ev=>{
  const r=ev.currentTarget.getBoundingClientRect(), f=(ev.clientX-r.left)/r.width;
  const tgt=Math.max(1,Math.min(NF,Math.round(f*NF)));
  reset(); let fc=0,j=0,last=null,lastMove=null;
  for(;j<N&&fc<tgt;j++){ const e=EV[j];
    if(e.t==='move'){lastMove=e;} else {L.polyline(e.p,OLD).addTo(done);visit(e.a);visit(e.b);fc++;} last=e; }
  if(lastMove) {setHome(lastMove,false); s3.textContent=lastMove.city;}
  i=j;flown=fc;fill.style.width=(100*fc/NF)+'%';cnt.textContent=fc+' / '+NF;
  if(last){hud(last); rt.className=''; rt.textContent=last.t==='fly'?last.a+'  \u2192  '+last.b:'';}
};
